name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run regression suite
        run: python -m pytest -q
      - name: Exercise offline setup
        run: python scripts/setup.py --mode demo --venv /tmp/tower-offline-venv --report /tmp/tower-demo.txt
      - name: Build source and wheel distributions
        run: python -m build
      - name: Smoke-test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/tower-wheel-venv
          /tmp/tower-wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/tower-wheel-venv/bin/tower --doctor --fake
          /tmp/tower-wheel-venv/bin/tower --fake --no-state --no-plugins --report /tmp/tower-wheel.txt
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: distributions-and-demo
          path: |
            dist/*
            /tmp/tower-demo.txt
